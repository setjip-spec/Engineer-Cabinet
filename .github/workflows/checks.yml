name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whitespace and unresolved merge markers
        shell: bash
        run: |
          git show --format= --check HEAD
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- '*.md' '*.yml'; then
            echo "Unresolved merge markers found"
            exit 1
          fi
